    <div class="tb-right">

      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme"></button>

    </div>
  </header>
  <div class="main">
    <section class="left">
      <div class="stage" id="stage">
        <div class="world" id="world">
          <svg class="wires" id="wires"></svg>
          <div id="cards"></div>
          <svg class="overlay-svg" id="overlay"></svg>
        </div>
        <div class="lasso" id="lasso" hidden></div>
        <div class="selbar" id="selbar" hidden></div>
        <div class="note-pop" id="pop" hidden></div>
        <div class="banner" id="banner" hidden></div>
        <div class="empty" id="empty" hidden></div>

        <div class="stage-tools">
          <button class="icon-btn" data-zoom="-1" aria-label="Zoom out"></button>
          <button class="icon-btn" data-zoom="0" aria-label="Fit"></button>
          <button class="icon-btn" data-zoom="1" aria-label="Zoom in"></button>
        </div>
      </div>
      <div class="dock">
        <div class="composer">
          <div class="cmp-context" id="cmpCtx"></div>
          <div class="cmp-box">
            <span class="cmp-mode" id="cmpMode"></span>
            <textarea id="msg" rows="1" placeholder="Describe a workflow, or say what to change…"></textarea>
            <button class="cmp-send" id="send" type="button" aria-label="Send"></button>
          </div>
        </div>
      </div>
    </section>
    <aside class="side">
      <div class="side-tabs" role="group" aria-label="Panel">
        <button type="button" data-tab="plan" aria-pressed="true">Plan</button>
        <button type="button" data-tab="chat" aria-pressed="false">Conversation</button>
        <button type="button" data-tab="library" aria-pressed="false">Library</button>
      </div>
      <div class="side-body" id="sideBody"></div>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
  </div>
</div>
