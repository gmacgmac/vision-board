<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uplynk Architect</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #F5F5F6; --surface: #FFFFFF; --surface-2: #EFEFF1; --surface-3: #E4E4E7;
  --line: #E1E1E5; --line-strong: #CBCBD1; --ink: #18181B; --ink-2: #3F3F46; --muted: #6B6B74;
  --brand: #FB1FA7; --accent: #D4138A; --accent-ink: #FFFFFF; --accent-soft: #FDE7F4; --accent-line: #F7B6DC; --accent-text: #C81784;
  --c-content: #3471D0; --c-remix: #C98A0B; --c-live: #E0552A; --c-channels: #1F8F7E; --c-monitor: #7257C6;
  --ok: #278F52; --warn: #B97C0C; --bad: #CC3B3B;
  --dot: rgb(24 24 27 / .09);
  --shadow: 0 1px 2px rgb(24 24 27 / .06), 0 4px 14px rgb(24 24 27 / .06);
  --shadow-lg: 0 10px 40px rgb(24 24 27 / .16);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #111112; --surface: #1A1A1C; --surface-2: #222225; --surface-3: #2C2C30;
    --line: #2A2A2E; --line-strong: #3A3A40; --ink: #EDEDEF; --ink-2: #C7C7CC; --muted: #94949C;
    --accent: #FF5CBE; --accent-ink: #1A0712; --accent-soft: #2E1726; --accent-line: #5E2449; --accent-text: #FF5CBE;
    --c-content: #72A6F2; --c-remix: #E8B04A; --c-live: #F38860; --c-channels: #4FC3B0; --c-monitor: #A48EF2;
    --ok: #4CC47F; --warn: #E6AF45; --bad: #F07474; --dot: rgb(255 255 255 / .07);
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 14px rgb(0 0 0 / .3); --shadow-lg: 0 10px 40px rgb(0 0 0 / .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #111112; --surface: #1A1A1C; --surface-2: #222225; --surface-3: #2C2C30;
  --line: #2A2A2E; --line-strong: #3A3A40; --ink: #EDEDEF; --ink-2: #C7C7CC; --muted: #94949C;
  --accent: #FF5CBE; --accent-ink: #1A0712; --accent-soft: #2E1726; --accent-line: #5E2449; --accent-text: #FF5CBE;
  --c-content: #72A6F2; --c-remix: #E8B04A; --c-live: #F38860; --c-channels: #4FC3B0; --c-monitor: #A48EF2;
  --ok: #4CC47F; --warn: #E6AF45; --bad: #F07474; --dot: rgb(255 255 255 / .07);
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 4px 14px rgb(0 0 0 / .3); --shadow-lg: 0 10px 40px rgb(0 0 0 / .55);
}

html, body { height: 100%; margin: 0; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; display: block; }
.muted { color: var(--muted); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding-inline: 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn-sm { height: 30px; padding-inline: 10px; border-radius: 8px; font-size: 12.5px; }
.btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.icon-btn { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.draft { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-rows: 52px minmax(0, 1fr); height: 100%; }
.tb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding-inline: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.tb-logo { display: flex; align-items: center; color: var(--ink); justify-self: start; padding: 4px; }
.tb-logo svg { display: block; height: 34px; width: auto; }
.tb-tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.tb-tab { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: default; }
.tb-ico { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; }
.tb-tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tb-tab[aria-current="page"] .tb-ico { background: linear-gradient(145deg, var(--tc), color-mix(in srgb, var(--tc) 68%, #000)); color: #fff; }
.tb-right { display: flex; align-items: center; gap: 6px; justify-self: end; }
.select { height: 30px; max-width: 280px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; font-size: 13px; font-weight: 600; }
@media (max-width: 1100px) { .tb-tab span { display: none; } .tb-tab { padding: 0 8px; } }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
.side-closed .main { grid-template-columns: minmax(0, 1fr) 0; }
.side-closed .side { display: none; }
.left { position: relative; display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; min-width: 0; }

/* ---------- Canvas ---------- */
.stage { position: relative; overflow: hidden; background-color: var(--ground); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); cursor: crosshair; touch-action: none; user-select: none; }
.stage.is-panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.wires, .overlay-svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.overlay-svg { z-index: 3; }
.wire { fill: none; stroke: var(--line-strong); stroke-width: 2; }
.wire.inner { stroke-dasharray: 5 5; }
.anim .wire.is-added { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s ease forwards; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.wire-label { font: 600 11px var(--f-body); fill: var(--muted); }
.band-label { font: 600 12px var(--f-mono); letter-spacing: .22em; fill: var(--muted); text-anchor: middle; }
.band-line { stroke: var(--line-strong); stroke-width: 1; }
.group-frame { fill: color-mix(in srgb, var(--gc) 5%, transparent); stroke: color-mix(in srgb, var(--gc) 55%, transparent); stroke-width: 1.5; stroke-dasharray: 6 5; }
.region { fill: color-mix(in srgb, var(--accent) 7%, transparent); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }

.card { position: absolute; left: 0; top: 0; z-index: 2; width: 220px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--fc) 38%, var(--line)); background: linear-gradient(170deg, color-mix(in srgb, var(--fc) 9%, var(--surface)) 0%, var(--surface) 55%); box-shadow: var(--shadow); cursor: pointer; transition: box-shadow .15s, border-color .15s; }
.card::before { content: ""; position: absolute; left: 18px; right: 18px; top: -1px; height: 1.5px; border-radius: 0 0 2px 2px; background: color-mix(in srgb, var(--fc) 75%, transparent); }
.card:hover { border-color: color-mix(in srgb, var(--fc) 70%, var(--line)); }
.card.is-sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent), var(--shadow); }
.anim .card.is-added { animation: pop-in .5s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(var(--d, 0) * 1ms); }
.anim .card.is-changed { animation: nudge .6s ease both; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes pop-in { from { opacity: 0; scale: .9; } }
@keyframes nudge { 40% { scale: 1.04; } }
.fam-live { --fc: var(--c-channels); } .fam-files { --fc: var(--c-monitor); } .fam-managed { --fc: var(--c-remix); }
.fam-uplynk { --fc: var(--accent); } .fam-destination { --fc: var(--c-content); }
.card-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 12px 8px 12px; }
.card-ico { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--fc) 16%, var(--surface)); color: var(--fc); }
.card-titles { flex: 1; min-width: 0; display: grid; gap: 1px; }
.card-kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--fc); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-label { font: 600 14.5px/1.2 var(--f-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.card-sub { font-size: 12.5px; font-weight: 600; color: var(--fc); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sched { display: grid; gap: 5px; }
.sched-bar { display: flex; gap: 2px; height: 8px; }
.sched-bar i { border-radius: 2px; background: color-mix(in srgb, var(--fc) 22%, transparent); }
.sched-bar i.live { background: var(--fc); }
.sched span { font-size: 11px; font-weight: 600; color: var(--muted); }
.card-flag { position: absolute; top: -10px; right: 12px; padding: 3px 7px; box-shadow: var(--shadow); border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: .06em; background: var(--accent); color: var(--accent-ink); }
.card-flag.changed { background: var(--warn); color: #1a1405; }
.card-body { display: grid; gap: 8px; padding: 0 12px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 11.5px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.att { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent-text); }
.card-notes { margin: 0; padding-left: 16px; display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
.card-expand { display: inline-flex; align-items: center; gap: 6px; justify-self: start; height: 26px; padding: 0 10px; border-radius: 8px; border: 1px dashed color-mix(in srgb, var(--fc) 60%, var(--line)); background: none; color: var(--fc); font-size: 12px; font-weight: 700; }
.card-expand:hover { background: color-mix(in srgb, var(--fc) 10%, transparent); }
.group-tag { position: absolute; left: 0; top: 0; z-index: 2; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--fc) 50%, var(--line)); background: var(--surface); color: var(--fc); font-size: 12px; font-weight: 700; white-space: nowrap; }
.group-tag .chip { height: 18px; font-size: 10.5px; }

.pin { position: absolute; left: 0; top: 0; z-index: 4; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 2px solid var(--surface); border-radius: 50% 50% 50% 4px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 800; box-shadow: var(--shadow); }
.pin:hover { transform: scale(1.1); }

.lasso { position: absolute; z-index: 5; border: 1.5px dashed var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 8%, transparent); pointer-events: none; }
.selbar { position: absolute; z-index: 6; display: flex; align-items: center; gap: 8px; padding: 5px 5px 5px 12px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 72%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); border: 1px solid color-mix(in srgb, var(--line-strong) 80%, transparent); color: var(--ink); font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow-lg); white-space: nowrap; }
.selbar .btn { height: 28px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 12.5px; }
.note-pop { position: absolute; z-index: 7; display: grid; gap: 8px; width: 320px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-lg); cursor: default; user-select: text; }
.note-pop .head { font-size: 12.5px; color: var(--muted); }
.note-pop .head b { color: var(--ink); }
.note-pop textarea { min-height: 76px; max-height: 200px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); resize: vertical; outline: 0; font-size: 14px; }
.note-pop textarea:focus { border-color: var(--accent); }
.note-pop .row { display: flex; align-items: center; gap: 6px; }
.note-pop .hint { flex: 1; font-size: 11.5px; color: var(--muted); }

.stage-tools { position: absolute; right: 14px; top: 14px; z-index: 6; display: flex; gap: 2px; padding: 3px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.stage-hint { position: absolute; left: 16px; top: 20px; z-index: 6; font-size: 12px; color: var(--muted); pointer-events: none; }
.stage-hint kbd { padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-strong); font: 11px var(--f-mono); }
.stage.has-banner .stage-hint { visibility: hidden; }
.banner { position: absolute; top: 14px; left: 50%; z-index: 8; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 72%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); border: 1px solid color-mix(in srgb, var(--line-strong) 80%, transparent); color: var(--ink); font-weight: 600; font-size: 13px; transform: translateX(-50%); box-shadow: var(--shadow-lg); white-space: nowrap; }
.banner .btn { height: 28px; border: 0; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.stage.is-busy .card { opacity: .55; }
.stage.is-busy::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--accent) 9%, transparent) 50%, transparent 70%); background-size: 250% 100%; animation: sweep 1.8s linear infinite; }
@keyframes sweep { from { background-position: 130% 0; } to { background-position: -130% 0; } }

.empty { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px; pointer-events: none; }
.empty-card { display: grid; gap: 12px; max-width: 620px; text-align: center; pointer-events: auto; cursor: default; }
.empty-card h1 { margin: 0; font: 600 34px/1.05 var(--f-display); letter-spacing: -.03em; }
.empty-card p { margin: 0; font-size: 15px; color: var(--muted); }
.examples { display: grid; gap: 8px; margin-top: 8px; text-align: left; }
.example { padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; color: var(--ink-2); text-align: left; }
.example:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink); }

/* ---------- Composer (same as the Content view) ---------- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; padding: 0 20px 18px; pointer-events: none; }
.composer { display: grid; gap: 8px; max-width: 760px; margin: 0 auto; pointer-events: auto; }
.cmp-context { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 0; }
.cmp-label { margin-right: 2px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.ctx-chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; max-width: 280px; padding: 0 4px 0 6px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 12.5px; font-weight: 600; }
.ctx-chip .n { display: grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 800; }
.ctx-chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-chip.plain { padding-left: 10px; background: var(--surface-2); border-color: var(--line); }
.ctx-chip button { display: grid; place-items: center; flex: none; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); }
.ctx-chip button:hover { color: var(--ink); background: color-mix(in srgb, var(--accent) 20%, transparent); }
.cmp-box { display: flex; align-items: flex-end; gap: 8px; padding: 8px; border-radius: 18px; background: color-mix(in srgb, var(--surface) 20%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); transition: border-color .15s, box-shadow .15s; }
.cmp-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent), var(--shadow); }
.cmp-mode { display: flex; align-items: center; gap: 6px; flex: none; height: 36px; padding: 0 10px; border-radius: 12px; background: color-mix(in srgb, var(--surface-2) 55%, transparent); font-size: 13px; font-weight: 600; color: var(--accent-text); }
.cmp-box textarea { flex: 1; min-width: 0; max-height: 180px; padding: 8px 4px; border: 0; outline: 0; background: none; resize: none; font-size: 15px; line-height: 1.45; }
.cmp-box textarea::placeholder { color: var(--muted); }
.cmp-send { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); }
.cmp-send:disabled { opacity: .4; cursor: default; }

/* ---------- Side panel ---------- */
.side { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; border-left: 1px solid var(--line); background: var(--surface); }
.side-tabs { display: flex; gap: 2px; margin: 12px 12px 0; padding: 3px; border-radius: 10px; background: var(--surface-2); }
.side-tabs button { flex: 1; height: 28px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 13px; font-weight: 600; }
.side-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.side-body { overflow: auto; padding: 14px 16px 20px; display: grid; align-content: start; gap: 18px; }
.sec { display: grid; gap: 8px; }
.sec h4 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.plan-title { margin: 0; font: 600 20px/1.2 var(--f-display); letter-spacing: -.015em; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.versions { display: flex; flex-wrap: wrap; gap: 4px; }
.vchip { height: 26px; min-width: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font: 600 12px var(--f-mono); color: var(--muted); }
.vchip:hover { color: var(--ink); border-color: var(--line-strong); }
.vchip[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.vchip.approved { box-shadow: inset 0 -2px 0 var(--ok); }
.summary { margin: 0; font-size: 14px; color: var(--ink-2); }
.removed { margin: 0; font-size: 12.5px; color: var(--bad); }
.assume { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.assume button { display: flex; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); text-align: left; font-size: 13px; color: var(--ink-2); }
.assume button:hover { border-color: var(--warn); }
.assume .q { flex: none; color: var(--warn); font-weight: 800; }
.notes-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.notes-list li { display: flex; align-items: flex-start; gap: 8px; padding: 8px; border-radius: 10px; border: 1px solid var(--accent-line); background: var(--accent-soft); font-size: 13px; cursor: pointer; }
.notes-list .n { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; }
.notes-list .t { flex: 1; min-width: 0; }
.notes-list small { display: block; color: var(--muted); font-size: 11.5px; }
.hint-box { padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--line-strong); font-size: 12.5px; color: var(--muted); }
.detail { display: grid; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
.detail-head { display: flex; align-items: center; gap: 10px; }
.detail-head b { display: block; font: 600 16px/1.2 var(--f-display); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; font-size: 13px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.side-foot { display: grid; gap: 6px; padding: 12px 16px 14px; border-top: 1px solid var(--line); }
.side-foot small { color: var(--muted); font-size: 12px; text-align: center; }
.lib-search { height: 34px; width: 100%; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); }
.lib-group { display: grid; gap: 6px; }
.lib-item { display: grid; grid-template-columns: 30px 1fr; gap: 4px 10px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); }
.lib-item .card-ico { width: 30px; height: 30px; border-radius: 8px; grid-row: span 6; }
.lib-item b { font-weight: 600; }
.lib-item p { margin: 0; font-size: 12.5px; color: var(--muted); }
.lib-item .chips .chip { height: 20px; font-size: 11px; font-weight: 500; }
.lib-item .chip.hit { background: var(--accent-soft); color: var(--accent-text); }

.convo { display: grid; gap: 12px; }
.msg { display: grid; gap: 6px; padding: 10px 12px; border-radius: 14px; font-size: 13.5px; }
.msg p { margin: 0; }
.msg .who { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.msg .meta { flex: 1; font-weight: 600; letter-spacing: 0; text-transform: none; }
.msg.you { margin-left: 24px; background: var(--accent-soft); border: 1px solid var(--accent-line); }
.msg.claude { margin-right: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.msg.claude .who { color: var(--accent-text); }
.msg.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
.msg.pending p { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.msg.pending .spinner { border-color: var(--line-strong); border-top-color: var(--accent); }
.msg-notes { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.msg-notes li { display: flex; gap: 6px; }
.msg-notes .n { display: grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 800; }
.msg-notes small, .msg > small { display: block; font-size: 11.5px; color: var(--muted); }
.problems { margin: 0; padding-left: 16px; display: grid; gap: 3px; font-size: 12.5px; }
.changes { display: flex; flex-wrap: wrap; gap: 4px; }
.chg { padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.chg.add { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.chg.mod { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.chg.del { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
details.retry { font-size: 12.5px; color: var(--ink-2); }
details.retry summary { cursor: pointer; color: var(--warn); font-weight: 600; }
details.retry ul { margin: 6px 0 0; padding-left: 16px; display: grid; gap: 3px; }
.sys { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--muted); text-align: center; }
.sys.ok { color: var(--ok); font-weight: 600; }
.vchip.sm { height: 20px; min-width: 0; padding: 0 6px; font-size: 11px; }
.io { font-size: 12px !important; color: var(--ink-2) !important; }
.io b { color: var(--muted); font-weight: 700; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
.rules { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rules li { display: grid; gap: 4px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.rules .pill { justify-self: start; height: 18px; font-size: 10.5px; }
.toasts { position: fixed; top: 64px; left: 50%; z-index: 90; display: grid; justify-items: center; gap: 8px; transform: translateX(-50%); pointer-events: none; }
.toast { max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--surface) 72%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); border: 1px solid color-mix(in srgb, var(--line-strong) 80%, transparent); color: var(--ink); border-left: 3px solid var(--accent); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); animation: toast-in .25s ease both; transition: opacity .3s; }
.toast.warn { border-left-color: var(--warn); background: color-mix(in srgb, color-mix(in srgb, var(--warn) 14%, var(--surface)) 78%, transparent); }
.toast.out { opacity: 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
.fatal { display: grid; place-items: center; height: 100%; padding: 24px; text-align: center; }
.fatal code { padding: 3px 8px; border-radius: 6px; background: var(--surface-2); font-family: var(--f-mono); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

const icon = (name, size = 16) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.box}</svg>`;
const shortName = (p) => { const m = /\(([^)]+)\)/.exec(p?.name || ''); return m ? m[1] : (p?.name || ''); };
const isTyping = (el) => !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));

let toastHost = null;
function toast(msg, kind = '') {
  if (!toastHost) { toastHost = document.createElement('div'); toastHost.className = 'toasts'; toastHost.setAttribute('role', 'status'); document.body.append(toastHost); }
  const t = document.createElement('div');
  t.className = `toast ${kind}`; t.textContent = msg; toastHost.append(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 4200);
}

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  let body = null;
  try { body = await r.json(); } catch { /* no body */ }
  if (!r.ok) { const err = new Error(body?.error || `HTTP ${r.status}`); err.status = r.status; err.body = body; throw err; }
  return body;
}

// ---------- state ----------
const S = {
  prims: {}, aliasMap: {},
  plans: [], planId: null, versions: [], latest: 0, cache: {},
  plan: null, viewing: 0, diff: null, animate: false,
  expanded: new Set(), selection: new Set(),
  notes: [], editing: null,
  busy: false, busyStart: 0,
  view: { x: 40, y: 40, k: 1 },
  vg: null, lay: null,
  tab: 'plan', libQuery: '', log: [], rules: [], pendingReq: null,
};
const emptyDiff = () => ({ added: new Set(), changed: new Set(), edges: new Set(), removed: [] });
const emptyPlan = (id) => ({ id, title: 'New plan', version: 0, status: 'draft', summary: '', assumptions: [], nodes: [], edges: [] });
const isLatest = () => S.viewing === S.latest;

const stage = $('#stage'), world = $('#world'), msgEl = $('#msg');

// ---------- plan diff & view graph ----------
function diffPlans(prev, cur) {
  const d = emptyDiff();
  if (!prev) return d;
  const key = (n) => JSON.stringify([n.type, n.label, n.props || {}, n.attachments || [], n.notes || [], n.subflow || null]);
  const pm = new Map(prev.nodes.map((n) => [n.id, n]));
  for (const n of cur.nodes) {
    if (!pm.has(n.id)) d.added.add(n.id);
    else if (key(pm.get(n.id)) !== key(n)) d.changed.add(n.id);
  }
  const cm = new Set(cur.nodes.map((n) => n.id));
  d.removed = prev.nodes.filter((n) => !cm.has(n.id)).map((n) => n.label);
  const pe = new Set(prev.edges.map((e) => `${e.from}>${e.to}`));
  for (const e of cur.edges) if (!pe.has(`${e.from}>${e.to}`)) d.edges.add(`${e.from}>${e.to}`);
  return d;
}

function subflowOf(n) {
  const sub = n.subflow || S.prims[n.type]?.subflow;
  return sub && Array.isArray(sub.nodes) && sub.nodes.length ? sub : null;
}

function viewGraph(plan) {
  const nodes = [], edges = [], groups = [], ends = new Map();
  for (const n of plan.nodes) {
    const sub = subflowOf(n);
    if (sub && S.expanded.has(n.id)) {
      const inner = sub.nodes.map((c) => ({ ...c, id: `${n.id}/${c.id}`, parent: n.id, prim: S.prims[c.type] }));
      const ie = (sub.edges || []).map((e) => ({ from: `${n.id}/${e.from}`, to: `${n.id}/${e.to}`, label: e.label || '', inner: true }));
      const hasIn = new Set(ie.map((e) => e.to)), hasOut = new Set(ie.map((e) => e.from));
      ends.set(n.id, { sources: inner.filter((c) => !hasIn.has(c.id)).map((c) => c.id), sinks: inner.filter((c) => !hasOut.has(c.id)).map((c) => c.id) });
      nodes.push(...inner); edges.push(...ie);
      groups.push({ id: n.id, node: n, prim: S.prims[n.type], members: inner.map((c) => c.id) });
    } else {
      nodes.push({ ...n, prim: S.prims[n.type], composite: !!sub });
    }
  }
  for (const e of plan.edges) {
    const froms = ends.get(e.from)?.sinks || [e.from];
    const tos = ends.get(e.to)?.sources || [e.to];
    for (const f of froms) for (const t of tos) edges.push({ from: f, to: t, label: e.label || '', key: `${e.from}>${e.to}` });
  }
  return { nodes, edges, groups };
}

// ---------- layout: layered, left to right ----------
const CARD_W = 220, COL_GAP = 62, ROW_GAP = 22;
function layout(vg, sizes) {
  const ids = vg.nodes.map((n) => n.id), order = new Map(ids.map((id, i) => [id, i]));
  const preds = new Map(ids.map((i) => [i, []])), succs = new Map(ids.map((i) => [i, []]));
  for (const e of vg.edges) if (preds.has(e.to) && succs.has(e.from) && e.from !== e.to) { preds.get(e.to).push(e.from); succs.get(e.from).push(e.to); }
  const layer = new Map(), stack = new Set();
  const L = (id) => {
    if (layer.has(id)) return layer.get(id);
    if (stack.has(id)) return 0;
    stack.add(id);
    const p = preds.get(id);
    const v = p.length ? Math.max(...p.map(L)) + 1 : 0;
    stack.delete(id); layer.set(id, v); return v;
  };
  ids.forEach(L);
  for (const id of ids) if (!preds.get(id).length && succs.get(id).length) layer.set(id, Math.max(0, Math.min(...succs.get(id).map((s) => layer.get(s))) - 1));
  const cols = [];
  ids.forEach((id) => (cols[layer.get(id)] ||= []).push(id));
  for (let i = 0; i < cols.length; i++) cols[i] ||= [];

  const y = new Map();
  const H = (id) => sizes.get(id)?.h ?? 110;
  const C = (id) => y.get(id) + H(id) / 2;
  const place = (col, want) => {
    const items = col.map((id) => ({ id, c: want(id) }));
    items.sort((a, b) => ((a.c ?? Infinity) - (b.c ?? Infinity)) || (order.get(a.id) - order.get(b.id)));
    let cur = -Infinity; const out = [];
    for (const it of items) {
      const h = H(it.id);
      let top = it.c != null ? it.c - h / 2 : (cur === -Infinity ? 0 : cur);
      if (top < cur) top = cur;
      out.push({ id: it.id, top, h, c: it.c }); cur = top + h + ROW_GAP;
    }
    const w = out.filter((o) => o.c != null);
    if (w.length) { const s = w.reduce((a, o) => a + (o.c - o.h / 2 - o.top), 0) / w.length; out.forEach((o) => { o.top += s; }); }
    out.forEach((o) => y.set(o.id, o.top));
  };
  const avgOf = (list) => { const l = list.filter((q) => y.has(q)); return l.length ? l.reduce((a, q) => a + C(q), 0) / l.length : null; };
  cols.forEach((col) => place(col, (id) => avgOf(preds.get(id))));
  for (let i = cols.length - 2; i >= 0; i--) place(cols[i], (id) => avgOf(succs.get(id)) ?? avgOf(preds.get(id)) ?? C(id));
  for (let i = 1; i < cols.length; i++) place(cols[i], (id) => avgOf(preds.get(id)) ?? C(id));

  const minY = ids.length ? Math.min(...ids.map((id) => y.get(id))) : 0;
  const pos = new Map();
  for (const id of ids) pos.set(id, { x: layer.get(id) * (CARD_W + COL_GAP), y: y.get(id) - minY, w: sizes.get(id)?.w ?? CARD_W, h: H(id), layer: layer.get(id) });
  const maxX = ids.length ? Math.max(...ids.map((id) => pos.get(id).x + pos.get(id).w)) : 0;
  const maxY = ids.length ? Math.max(...ids.map((id) => pos.get(id).y + pos.get(id).h)) : 0;

  // IN / MAKE / OUT bands over the columns
  const stageOf = new Map(vg.nodes.map((n) => [n.id, n.prim?.stage || 'make']));
  const colStage = cols.map((col) => {
    const count = {}; col.forEach((id) => { const s = stageOf.get(id); count[s] = (count[s] || 0) + 1; });
    return Object.entries(count).sort((a, b) => b[1] - a[1])[0]?.[0] || 'make';
  });
  const bands = [];
  colStage.forEach((s, i) => { const last = bands[bands.length - 1]; if (last && last.stage === s) last.to = i; else bands.push({ stage: s, from: i, to: i }); });
  return { pos, bands, bounds: { x: 0, y: 0, w: maxX, h: maxY } };
}

// ---------- rendering ----------
function cardHTML(n) {
  const p = n.prim || {}, fam = p.family || 'destination';
  const flag = S.diff.added.has(n.id) ? 'new' : S.diff.changed.has(n.id) ? 'changed' : '';
  const scheduled = n.type === 'channel' && /sched/i.test(n.props?.mode || '');
  const props = Object.entries(n.props || {}).filter(([k, v]) => v != null && String(v).trim() !== '' && k !== 'name' && !(scheduled && k === 'mode'));
  const atts = n.attachments || [];
  const notes = (n.notes || []).slice(0, 3);
  const sub = n.label && n.label.trim().toLowerCase() !== String(p.name || '').toLowerCase() ? n.label : '';
  const sched = scheduled ? `<div class="sched"><div class="sched-bar">${[['live', 3], ['', 2], ['live', 1], ['', 3], ['live', 2]].map(([k, w]) => `<i class="${k}" style="flex:${w}"></i>`).join('')}</div><span>Scheduled · live + VOD</span></div>` : '';
  return `<div class="card fam-${esc(fam)} ${flag ? `is-${flag === 'new' ? 'added' : 'changed'}` : ''} ${S.selection.has(n.id) ? 'is-sel' : ''}" data-id="${esc(n.id)}" style="width:${CARD_W}px">
    <div class="card-head">
      <i class="card-ico">${icon(scheduled ? 'calendar' : p.icon, 18)}</i>
      <div class="card-titles"><b class="card-label">${esc(p.name || n.type)}</b>${sub ? `<span class="card-sub">${esc(sub)}</span>` : ''}</div>
      ${flag ? `<span class="card-flag ${flag}">${flag === 'new' ? 'NEW' : 'CHANGED'}</span>` : ''}
    </div>
    ${sched || props.length || atts.length || notes.length || n.composite ? `<div class="card-body">
      ${sched}
      ${props.length ? `<div class="chips">${props.map(([k, v]) => `<span class="chip" title="${esc(k)}">${esc(v)}</span>`).join('')}</div>` : ''}
      ${atts.length ? `<div class="chips">${atts.map((a) => { const ap = S.prims[a.type]; const detail = Object.values(a.props || {}).filter(Boolean).join(' · '); return `<span class="chip att" title="${esc((ap?.name || a.type) + (detail ? ': ' + detail : ''))}">${icon(ap?.icon || 'tag', 12)}${esc(shortName(ap) || a.type)}</span>`; }).join('')}</div>` : ''}
      ${notes.length ? `<ul class="card-notes">${notes.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      ${n.composite ? `<button class="card-expand" type="button" data-expand="${esc(n.id)}">${icon('layers', 13)}Show inside</button>` : ''}
    </div>` : ''}
  </div>`;
}

function edgePath(a, b) {
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x - 6, y2 = b.y + b.h / 2;
  const dx = Math.max(40, (x2 - x1) / 2);
  return { d: `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
}

function render({ fit = false } = {}) {
  const plan = S.plan;
  const vg = S.vg = viewGraph(plan);
  const cards = $('#cards');
  cards.innerHTML = vg.nodes.map(cardHTML).join('');
  const sizes = new Map();
  cards.querySelectorAll('.card').forEach((el) => sizes.set(el.dataset.id, { w: el.offsetWidth, h: el.offsetHeight }));
  const lay = S.lay = layout(vg, sizes);
  cards.querySelectorAll('.card').forEach((el) => {
    const p = lay.pos.get(el.dataset.id);
    el.style.transform = `translate(${p.x}px, ${p.y}px)`;
    el.style.setProperty('--d', String(p.layer * 140));
  });

  // wires, bands, group frames
  let svg = `<defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9z" fill="var(--line-strong)"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9z" fill="var(--accent)"/></marker>
  </defs>`;
  let top = 0;
  for (const g of vg.groups) for (const m of g.members) { const r = lay.pos.get(m); if (r) top = Math.min(top, r.y - 44); }
  lay.bounds = { x: 0, y: top - 64, w: lay.bounds.w, h: lay.bounds.h + 64 + (0 - top) };
  for (const b of lay.bands) {
    const x1 = b.from * (CARD_W + COL_GAP), x2 = b.to * (CARD_W + COL_GAP) + CARD_W;
    svg += `<text class="band-label" x="${(x1 + x2) / 2}" y="${top - 38}">${b.stage.toUpperCase()}</text><line class="band-line" x1="${x1}" x2="${x2}" y1="${top - 26}" y2="${top - 26}"/>`;
  }
  const tags = [];
  for (const g of vg.groups) {
    const rs = g.members.map((m) => lay.pos.get(m)).filter(Boolean);
    if (!rs.length) continue;
    const x = Math.min(...rs.map((r) => r.x)) - 16, yy = Math.min(...rs.map((r) => r.y)) - 44;
    const w = Math.max(...rs.map((r) => r.x + r.w)) + 16 - x, h = Math.max(...rs.map((r) => r.y + r.h)) + 16 - yy;
    const fam = g.prim?.family || 'uplynk';
    svg += `<rect class="group-frame fam-${fam}" style="--gc: var(--fc)" x="${x}" y="${yy}" width="${w}" height="${h}" rx="18"/>`;
    const atts = (g.node.attachments || []).map((a) => `<span class="chip att">${icon(S.prims[a.type]?.icon || 'tag', 11)}${esc(shortName(S.prims[a.type]) || a.type)}</span>`).join('');
    tags.push(`<button class="group-tag fam-${esc(fam)}" type="button" data-expand="${esc(g.id)}" style="transform: translate(${x + 12}px, ${yy + 10}px)">${icon('down', 13)}${esc(g.node.label)} · inside${atts}</button>`);
  }
  vg.edges.forEach((e) => {
    const a = lay.pos.get(e.from), b = lay.pos.get(e.to);
    if (!a || !b) return;
    const { d, mx, my } = edgePath(a, b);
    const added = e.key && S.diff.edges.has(e.key);
    svg += `<path class="wire ${e.inner ? 'inner' : ''} ${added ? 'is-added' : ''}" d="${d}" pathLength="1" marker-end="url(#arr)" style="--d:${b.layer * 140 - 60}"/>`;
    if (e.label) svg += `<text class="wire-label" x="${mx}" y="${my - 6}" text-anchor="middle">${esc(e.label)}</text>`;
  });
  $('#wires').innerHTML = svg;
  cards.insertAdjacentHTML('beforeend', tags.join(''));

  world.classList.toggle('anim', S.animate);
  if (S.animate) { S.animate = false; setTimeout(() => world.classList.remove('anim'), 2600); }

  renderAnnotations();
  renderEmpty();
  renderBanner();
  renderSide();
  renderComposer();
  if (fit) fitView(); else applyView();
  updateSelbar();
}

function renderAnnotations() {
  let svg = '';
  const pins = [];
  S.notes.forEach((n, i) => {
    if (n.region) {
      const r = n.region;
      svg += `<rect class="region" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="10"/>`;
      pins.push({ i, x: r.x - 10, y: r.y - 14 });
    } else {
      n.nodes.forEach((id) => { const p = S.lay?.pos.get(id); if (p) pins.push({ i, x: p.x + p.w - 14, y: p.y - 14 }); });
    }
  });
  $('#overlay').innerHTML = svg;
  const cards = $('#cards');
  cards.querySelectorAll('.pin').forEach((el) => el.remove());
  cards.insertAdjacentHTML('beforeend', pins.map((p) => `<button class="pin" type="button" data-note="${p.i}" style="transform: translate(${p.x}px, ${p.y}px)" aria-label="Note ${p.i + 1}">${p.i + 1}</button>`).join(''));
}

function updateSelection() {
  document.querySelectorAll('#cards .card').forEach((el) => el.classList.toggle('is-sel', S.selection.has(el.dataset.id)));
  renderSide(); renderComposer(); updateSelbar();
}

// ---------- view transform ----------
function applyView() {
  const { x, y, k } = S.view;
  world.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
  stage.style.backgroundSize = `${22 * k}px ${22 * k}px`;
  stage.style.backgroundPosition = `${x}px ${y}px`;
  updateSelbar(); positionPop();
}
function fitView() {
  const b = S.lay?.bounds;
  const W = stage.clientWidth, Hh = stage.clientHeight - ($('.dock')?.offsetHeight || 0);
  if (!b || !b.w) { S.view = { x: 40, y: 80, k: 1 }; applyView(); return; }
  const pad = 48;
  const k = Math.max(.3, Math.min(1.05, (W - pad * 2) / b.w, (Hh - pad * 2) / b.h));
  S.view = { k, x: (W - b.w * k) / 2 - b.x * k, y: (Hh - b.h * k) / 2 - b.y * k };
  applyView();
}
function zoomAt(f, cx, cy) {
  const { x, y, k } = S.view;
  const nk = Math.max(.25, Math.min(2.2, k * f));
  S.view = { k: nk, x: cx - (cx - x) * (nk / k), y: cy - (cy - y) * (nk / k) };
  applyView();
}
const toScreen = (wx, wy) => ({ x: wx * S.view.k + S.view.x, y: wy * S.view.k + S.view.y });
const toWorld = (sx, sy) => ({ x: (sx - S.view.x) / S.view.k, y: (sy - S.view.y) / S.view.k });

// ---------- selection bar & note popover ----------
function selBox(ids) {
  const rs = [...ids].map((id) => S.lay?.pos.get(id)).filter(Boolean);
  if (!rs.length) return null;
  const x1 = Math.min(...rs.map((r) => r.x)), y1 = Math.min(...rs.map((r) => r.y));
  const x2 = Math.max(...rs.map((r) => r.x + r.w)), y2 = Math.max(...rs.map((r) => r.y + r.h));
  const a = toScreen(x1, y1), b = toScreen(x2, y2);
  return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y };
}
function updateSelbar() {
  const bar = $('#selbar');
  const show = S.selection.size && !S.editing && !S.busy && isLatest();
  if (!show) { bar.hidden = true; return; }
  const box = selBox(S.selection);
  if (!box) { bar.hidden = true; return; }
  bar.innerHTML = `<span>${S.selection.size} selected</span><button class="btn btn-sm" type="button" data-act="note">${icon('plus', 14)}Add note</button>`;
  bar.hidden = false;
  const W = stage.clientWidth;
  bar.style.left = `${Math.max(8, Math.min(W - bar.offsetWidth - 8, box.x + box.w / 2 - bar.offsetWidth / 2))}px`;
  bar.style.top = `${Math.max(8, box.y - bar.offsetHeight - 12)}px`;
}

function labelOf(id) {
  const n = S.vg?.nodes.find((x) => x.id === id);
  if (!n) return id;
  if (!n.label) return n.prim?.name || id;
  const parent = n.parent ? S.plan.nodes.find((p) => p.id === n.parent) : null;
  return parent ? `${parent.label} › ${n.label}` : n.label;
}
function targetOf(id) {
  const n = S.vg?.nodes.find((x) => x.id === id);
  return n ? { id, type: n.type, label: labelOf(id) } : { id };
}

function openNote(draft) {
  // draft: { index?: number, nodes: [], region: null | {x,y,w,h}, text }
  S.editing = draft;
  const pop = $('#pop');
  const names = draft.nodes.map(labelOf);
  pop.innerHTML = `
    <div class="head">${draft.index != null ? `Note ${draft.index + 1} on` : 'Note on'} <b>${esc(names.join(', ') || 'this area')}</b></div>
    <textarea id="noteText" placeholder="Say or type what should change here…">${esc(draft.text || '')}</textarea>
    <div class="row">
      ${draft.index != null ? `<button class="btn btn-sm" type="button" data-act="del-note">Remove</button>` : ''}
      <span class="hint">Enter to add · Esc to cancel</span>
      <button class="btn btn-sm" type="button" data-act="cancel-note">Cancel</button>
      <button class="btn btn-sm btn-primary" type="button" data-act="save-note">${draft.index != null ? 'Save' : 'Add note'}</button>
    </div>`;
  pop.hidden = false;
  positionPop();
  updateSelbar();
  const ta = $('#noteText');

}
function positionPop() {
  const pop = $('#pop');
  if (pop.hidden || !S.editing) return;
  const d = S.editing;
  let box = d.region ? (() => { const a = toScreen(d.region.x, d.region.y), b = toScreen(d.region.x + d.region.w, d.region.y + d.region.h); return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y }; })() : selBox(d.nodes);
  if (!box) box = { x: stage.clientWidth / 2 - 160, y: 80, w: 0, h: 0 };
  const W = stage.clientWidth, Hh = stage.clientHeight - ($('.dock')?.offsetHeight || 0), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = box.x + box.w + 14, top = box.y;
  if (left + pw > W - 8) left = Math.max(8, box.x - pw - 14);
  if (left < 8) { left = Math.max(8, Math.min(W - pw - 8, box.x)); top = box.y + box.h + 12; }
  top = Math.max(8, Math.min(Hh - ph - 8, top));
  pop.style.left = `${left}px`; pop.style.top = `${top}px`;
}
function closeNote() { S.editing = null; $('#pop').hidden = true; updateSelbar(); }
function saveNote() {
  const d = S.editing; if (!d) return;

  else S.notes.push({ id: `a${Date.now().toString(36)}`, text, nodes: d.nodes, region: d.region || null });

// ---------- pointer & keyboard ----------
let drag = null, spaceDown = false;
stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.note-pop, .selbar, .stage-tools, .banner, .empty-card')) return;
  const pin = e.target.closest('.pin');
  if (pin) { const i = +pin.dataset.note; openNote({ index: i, nodes: S.notes[i].nodes, region: S.notes[i].region, text: S.notes[i].text }); return; }
  const exp = e.target.closest('[data-expand]');
  if (exp) { toggleExpand(exp.dataset.expand); return; }
  const card = e.target.closest('.card');
  if (card && !spaceDown && e.button === 0) {
    const id = card.dataset.id;
    if (e.shiftKey || e.metaKey || e.ctrlKey) { S.selection.has(id) ? S.selection.delete(id) : S.selection.add(id); }
    else S.selection = new Set([id]);
    if (S.editing) closeNote();
    updateSelection();
    return;
  }
  const pan = e.button === 1 || spaceDown || e.altKey || !isLatest() || S.busy;
  drag = { mode: pan ? 'pan' : 'lasso', sx: e.clientX, sy: e.clientY, vx: S.view.x, vy: S.view.y, moved: false };
  if (pan) stage.classList.add('is-panning');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (drag.mode === 'pan') { S.view.x = drag.vx + dx; S.view.y = drag.vy + dy; applyView(); return; }
  if (!drag.moved) return;
  const r = stage.getBoundingClientRect();
  const x = Math.min(e.clientX, drag.sx) - r.left, y = Math.min(e.clientY, drag.sy) - r.top;
  Object.assign($('#lasso').style, { left: `${x}px`, top: `${y}px`, width: `${Math.abs(dx)}px`, height: `${Math.abs(dy)}px` });
  $('#lasso').hidden = false;
});
stage.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  stage.classList.remove('is-panning');
  $('#lasso').hidden = true;
  if (d.mode === 'lasso' && d.moved) {
    const r = stage.getBoundingClientRect();
    const a = toWorld(Math.min(e.clientX, d.sx) - r.left, Math.min(e.clientY, d.sy) - r.top);
    const b = toWorld(Math.max(e.clientX, d.sx) - r.left, Math.max(e.clientY, d.sy) - r.top);
    const region = { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y };
    const hits = [...S.lay.pos.entries()].filter(([, p]) => p.x < b.x && p.x + p.w > a.x && p.y < b.y && p.y + p.h > a.y).map(([id]) => id);
    if (!hits.length) { toast('Drag around one or more boxes to comment on that area.'); return; }
    S.selection = new Set(hits); updateSelection();
    openNote({ nodes: hits, region });
  } else if (!d.moved && d.mode === 'lasso') {
    if (S.editing) closeNote();
    if (S.selection.size) { S.selection.clear(); updateSelection(); }
  }
});
stage.addEventListener('dblclick', (e) => {
  const card = e.target.closest('.card');
  if (!card || !isLatest() || S.busy) return;
  S.selection = new Set([card.dataset.id]); updateSelection();
  openNote({ nodes: [card.dataset.id], region: null });
});
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.0025), e.clientX - r.left, e.clientY - r.top);
  else { S.view.x -= e.deltaX; S.view.y -= e.deltaY; applyView(); }
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'noteText') {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeNote(); }
    return;
  }
  if (isTyping(e.target)) return;
  if (e.code === 'Space') { spaceDown = true; stage.classList.add('is-panning'); e.preventDefault(); }
  else if (e.key === 'f' || e.key === 'F') fitView();
  else if ((e.key === 'n' || e.key === 'N') && S.selection.size && isLatest()) { e.preventDefault(); openNote({ nodes: [...S.selection], region: null }); }
  else if (e.key === 'Escape') { if (S.editing) closeNote(); else { S.selection.clear(); updateSelection(); } }
});
document.addEventListener('keyup', (e) => { if (e.code === 'Space') { spaceDown = false; if (!drag) stage.classList.remove('is-panning'); } });

document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'note') openNote({ nodes: [...S.selection], region: null });
  else if (act === 'save-note') saveNote();
  else if (act === 'cancel-note') closeNote();
  else if (act === 'del-note') removeNote(S.editing.index);
  else if (act === 'latest') show(S.latest, { fit: false });
  else if (act === 'approve') approve();
  else if (act === 'expand') toggleExpand(e.target.closest('[data-act]').dataset.id);
  const z = e.target.closest('[data-zoom]')?.dataset.zoom;

});

function toggleExpand(id) {

async function send() {
  const message = msgEl.value.trim();
  if (S.busy || !isLatest() || (!message && !S.notes.length)) return;
  const annotations = S.notes.map((n) => ({ id: n.id, text: n.text, nodes: n.nodes, region: n.region, targets: n.nodes.map(targetOf) }));
  const selection = [...S.selection];
  const prev = S.plan;
  if (S.editing) closeNote();
  S.pendingReq = { message, annotations, selection };
  S.tab = 'chat';
  document.querySelectorAll('.side-tabs [data-tab]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.tab === 'chat')));
  setBusy(true);
  try {
    const plan = await api(`/api/plans/${enc(S.planId)}/propose`, { method: 'POST', body: JSON.stringify({ message, annotations, selection }) });
    S.cache[plan.version] = plan;
    await refreshVersions();
    await loadPlans();
    await loadLog();
    S.pendingReq = null;
    S.notes = []; S.selection.clear();
    msgEl.value = ''; autosize();
    S.busy = false; stage.classList.remove('is-busy');
    display(plan, prev, { fit: true, animate: true });
    toast(`v${plan.version} · ${plan.summary || 'Plan updated.'}`);
  } catch (err) {
    const p = err.body?.problems;
    toast(err.status === 422 ? `Claude's plan didn't check out${p?.length ? `: ${p[0]}` : ''}. Try rephrasing.` : err.status === 409 ? 'Already planning, hang on.' : `Couldn't plan: ${err.message}`, 'warn');
  } finally {
    if (S.pendingReq) { S.pendingReq = null; await loadLog(); }
    setBusy(false);
  }
}

async function approve() {
  if (!isLatest() || S.plan.status === 'approved' || !S.latest) return;
  try {
    const prev = S.plan;
    const plan = await api(`/api/plans/${enc(S.planId)}/approve`, { method: 'POST', body: '{}' });
    S.cache[plan.version] = plan;
    await refreshVersions(); await loadPlans();
    display(plan, prev, { fit: false, animate: false });
    toast(`Approved as v${plan.version}. This is the plan of record.`);
  } catch (err) { toast(`Couldn't approve: ${err.message}`, 'warn'); }
}

async function loadLog() {
  try { S.log = await api(`/api/plans/${enc(S.planId)}/log`); } catch { S.log = []; }
  if (!Array.isArray(S.log)) S.log = [];
}
function versionDiff(v) {
  const cur = S.cache[v], prev = v > 1 ? S.cache[v - 1] : null;
  if (!cur || (v > 1 && !prev)) return null;
  const d = diffPlans(prev || { nodes: [], edges: [] }, cur);
  const lab = (id) => cur.nodes.find((n) => n.id === id)?.label || id;
  return { added: [...d.added].map(lab), changed: [...d.changed].map(lab), removed: d.removed };
}
let fetchingVersions = false;
function youHTML(r) {
  const notes = r.annotations || [];
  return `<div class="msg you"><div class="who">You</div>
    ${r.message ? `<p>${esc(r.message)}</p>` : ''}
    ${notes.length ? `<ul class="msg-notes">${notes.map((n, i) => `<li><span class="n">${i + 1}</span><span>${esc(n.text)}<small>on ${esc((n.targets || []).map((t) => t.label || t.id).join(', ') || (n.nodes || []).join(', '))}</small></span></li>`).join('')}</ul>` : ''}
    ${r.selection?.length ? `<small>Selected: ${esc(r.selection.map(labelOf).join(', '))}</small>` : ''}
  </div>`;
}
function renderConversation() {
  const body = $('#sideBody');
  const items = [], logged = new Set();
  for (const e of S.log) { items.push({ t: Date.parse(e.at) || 0, kind: 'turn', e }); if (e.version) logged.add(e.version); }
  for (const v of S.versions) {
    const t = Date.parse(v.createdAt) || 0;
    if (v.status === 'approved' && !logged.has(v.version)) items.push({ t, kind: 'approved', v });
    else if (!logged.has(v.version)) items.push({ t, kind: 'direct', v });
  }
  items.sort((a, b) => a.t - b.t);
  const need = S.versions.map((v) => v.version).filter((n) => !S.cache[n]);
  if (need.length && !fetchingVersions) {
    fetchingVersions = true;
    Promise.all(need.map((n) => getVersion(n).catch(() => null))).finally(() => { fetchingVersions = false; if (S.tab === 'chat') renderConversation(); });
  }
  const vbtn = (n) => `<button class="vchip sm" type="button" data-v="${n}" aria-current="${n === S.viewing}">v${n}</button>`;
  const html = items.map((it) => {
    if (it.kind === 'approved') return `<div class="sys ok">${icon('check', 13)}Approved as ${vbtn(it.v.version)} · plan of record</div>`;
    if (it.kind === 'direct') return `<div class="sys">${vbtn(it.v.version)} saved straight to the plan files${it.v.summary ? ` · ${esc(it.v.summary)}` : ''}</div>`;
    const e = it.e, tries = e.attempts || [], failed = tries.filter((a) => !a.ok);
    const secs = e.ms ? `${Math.round(e.ms / 1000)}s` : '';
    const probs = [...new Set(failed.flatMap((a) => a.problems || []))];
    let claude;
    if (e.ok) {
      const d = e.version ? versionDiff(e.version) : null;
      const chg = d ? [...d.added.map((l) => `<span class="chg add">+ ${esc(l)}</span>`), ...d.changed.map((l) => `<span class="chg mod">~ ${esc(l)}</span>`), ...d.removed.map((l) => `<span class="chg del">− ${esc(l)}</span>`)].join('') : '';
      claude = `<div class="msg claude"><div class="who">${icon('sparkle', 13)}Claude<span class="meta">${secs}${tries.length > 1 ? ` · ${tries.length} tries` : ''}</span>${e.version ? vbtn(e.version) : ''}</div>
        <p>${esc(e.reply || e.summary || '')}</p>
        ${chg ? `<div class="changes">${chg}</div>` : ''}
        ${probs.length ? `<details class="retry"><summary>${failed.length === 1 ? 'First draft' : `${failed.length} drafts`} broke the rules, fixed before saving</summary><ul>${probs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
      </div>`;
    } else {
      claude = `<div class="msg claude bad"><div class="who">${icon('sparkle', 13)}Claude<span class="meta">${secs}${tries.length > 1 ? ` · ${tries.length} tries` : ''}</span></div>
        <p>Couldn't produce a plan that follows the platform rules, so nothing was saved.</p>
        ${(e.problems || []).length ? `<ul class="problems">${e.problems.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      </div>`;
    }
    return youHTML(e.request || {}) + claude;
  }).join('');
  const pending = S.busy && S.pendingReq ? youHTML(S.pendingReq) + `<div class="msg claude pending"><div class="who">${icon('sparkle', 13)}Claude</div><p><span class="spinner"></span>Planning, checking the rules <span class="num" id="busyT2">0s</span></p></div>` : '';
  body.innerHTML = `<div class="sec"><h2 class="plan-title">Conversation</h2><p class="summary" style="font-size:13px">What you asked, what Claude answered, and what changed in each version.</p></div>
    <div class="convo">${html || pending ? html + pending : '<div class="hint-box">Nothing sent yet. Your requests and Claude\'s replies will show up here.</div>'}</div>`;
  body.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => show(+b.dataset.v, { fit: false })));
  body.scrollTop = body.scrollHeight;
}

const FAMILIES = [['live', 'Live'], ['managed', 'Managed service'], ['files', 'Files'], ['uplynk', 'Uplynk platform'], ['destination', 'Audiences & outputs']];
function renderLibrary() {
  const body = $('#sideBody');
  const q = S.libQuery.trim().toLowerCase();
  const all = Object.values(S.prims);
  const match = (p) => !q || [p.name, p.type, p.description, ...(p.aliases || [])].some((s) => String(s || '').toLowerCase().includes(q));
  const nm = (t) => S.prims[t]?.name || t;
  const io = (p) => {
    if (p.kind === 'attachment') return `<p class="io"><b>On</b>${esc((p.attachesTo || []).map(nm).join(', '))}</p>`;
    const i = p.inputs || {}, o = p.outputs || {};
    const inTxt = i.max === 0 ? 'none, starts a flow' : `${i.max == null ? 'any number' : i.max} from ${(i.from || []).map(nm).join(', ')}`;
    const outTxt = o.max === 0 ? 'none, ends the flow' : `${o.max == null ? '' : `${o.max} `}to ${(o.to || []).map(nm).join(', ')}`;
    return `<p class="io"><b>In</b>${esc(inTxt)}</p><p class="io"><b>Out</b>${esc(outTxt)}</p>`;
  };
  const item = (p) => `<div class="lib-item fam-${esc(p.family || 'uplynk')}"><i class="card-ico">${icon(p.icon, 16)}</i><div class="row" style="gap:6px"><b>${esc(p.name)}</b>${p.kind === 'attachment' ? '<span class="pill">add-on</span>' : `<span class="pill">${esc((p.stage || '').toUpperCase())}</span>`}</div><p>${esc(p.description || '')}</p>${io(p)}<div class="chips">${(p.aliases || []).map((a) => `<span class="chip ${q && a.toLowerCase().includes(q) ? 'hit' : ''}">${esc(a)}</span>`).join('')}</div></div>`;
  const groups = FAMILIES.map(([f, name]) => [name, all.filter((p) => p.kind !== 'attachment' && p.family === f && match(p))])
    .concat([['Add-ons (badges on a step)', all.filter((p) => p.kind === 'attachment' && match(p))]])
    .filter(([, list]) => list.length);
  const had = document.activeElement?.id === 'libQ';
  body.innerHTML = `
    <div class="sec"><h2 class="plan-title">The vocabulary</h2><p class="summary" style="font-size:13px">Every word an operator might say maps to one building block. Claude can only plan with these.</p>
    <input class="lib-search" id="libQ" type="search" placeholder="Try &quot;slicer&quot;, &quot;zixi&quot; or &quot;protected&quot;" value="${esc(S.libQuery)}"></div>
    ${(() => { const ENF = ['max-inputs', 'accepts', 'abr-path', 'abr-no-attachment']; const rs = S.rules.filter((r) => !q || String(r.text).toLowerCase().includes(q)); return rs.length ? `<div class="sec"><h4>Platform rules · ${rs.length}</h4><ul class="rules">${rs.map((r) => `<li><span class="pill ${ENF.includes(r.check) ? 'ok' : ''}">${ENF.includes(r.check) ? 'Enforced' : 'Guidance'}</span>${esc(r.text)}</li>`).join('')}</ul></div>` : ''; })()}
    ${groups.map(([name, list]) => `<div class="sec lib-group"><h4>${esc(name)} · ${list.length}</h4>${list.map(item).join('')}</div>`).join('') || '<div class="hint-box">No building block matches that. That word would need adding to the library.</div>'}`;
  const inp = $('#libQ');
  inp.addEventListener('input', () => { S.libQuery = inp.value; renderLibrary(); });
  if (had) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

// ---------- plans & versions ----------
async function loadPlans() {
  try { S.plans = await api('/api/plans'); } catch { S.plans = []; }
  renderPlanSelect();
}
function renderPlanSelect() {
  const sel = $('#planSel');
  const list = [...S.plans];
  if (S.planId && !list.some((p) => p.id === S.planId)) list.unshift({ id: S.planId, title: 'New plan (unsaved)' });
  sel.innerHTML = list.map((p) => `<option value="${esc(p.id)}" ${p.id === S.planId ? 'selected' : ''}>${esc(p.title || p.id)}</option>`).join('');
}
$('#planSel').addEventListener('change', (e) => openPlan(e.target.value));
$('#newPlan').addEventListener('click', () => {
  const d = new Date(), pad = (n) => String(n).padStart(2, '0');
  openPlan(`plan-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`);
  msgEl.focus();
});

async function refreshVersions() {
  try { S.versions = await api(`/api/plans/${enc(S.planId)}/versions`); } catch { S.versions = []; }
  S.versions.sort((a, b) => a.version - b.version);
  S.latest = S.versions.reduce((m, v) => Math.max(m, v.version), 0);
}
async function getVersion(n) {
  if (!S.cache[n]) S.cache[n] = await api(`/api/plans/${enc(S.planId)}/v/${n}`);
  return S.cache[n];
}
function display(plan, prev, { fit = false, animate = false } = {}) {
  S.plan = plan; S.viewing = plan.version || 0;
  S.diff = diffPlans(prev, plan);
  S.animate = animate;
  S.selection = new Set([...S.selection].filter((id) => plan.nodes.some((n) => n.id === id)));
  render({ fit });
}
async function show(n, { fit = false } = {}) {
  try {
    const plan = await getVersion(n);
    const prev = n > 1 ? await getVersion(n - 1).catch(() => null) : null;
    if (S.editing) closeNote();
    display(plan, prev, { fit, animate: false });
  } catch (err) { toast(`Couldn't load v${n}: ${err.message}`, 'warn'); }
}

let es = null;
function openEvents() {
  if (es) es.close();
  es = new EventSource(`/api/plans/${enc(S.planId)}/events`);
  es.addEventListener('version', async (ev) => {
    let v = 0; try { v = JSON.parse(ev.data).version; } catch { return; }
    if (S.busy || !v || v <= S.latest) return;
    const wasLatest = isLatest();
    const prev = S.plan;
    await refreshVersions(); await loadPlans(); await loadLog();
    if (wasLatest) {
      S.cache = {};
      const plan = await getVersion(S.latest);
      display(plan, prev, { fit: true, animate: true });
      toast(`v${plan.version} arrived · ${plan.summary || ''}`);
    } else renderSide();
  });
}

async function openPlan(id) {
  S.planId = id; S.cache = {}; S.notes = []; S.selection.clear(); S.expanded.clear();
  if (S.editing) closeNote();
  try { history.replaceState(null, '', `?plan=${enc(id)}`); } catch { /* ignore */ }
  await refreshVersions();
  await loadLog();
  if (S.latest) await show(S.latest, { fit: true });
  else display(emptyPlan(id), null, { fit: true });
  renderPlanSelect();
  openEvents();
}

// ---------- chrome ----------
const TABS = [
  { label: 'Content', icon: 'layers', color: 'var(--c-content)' },
  { label: 'Remix', icon: 'scissors', color: 'var(--c-remix)' },
  { label: 'Live events', icon: 'pulse', color: 'var(--c-live)' },
  { label: 'Channels', icon: 'calendar', color: 'var(--c-channels)' },
  { label: 'Architect', icon: 'sparkle', color: 'var(--accent)', current: true },
];
$('#tabs').innerHTML = TABS.map((t) => `<span class="tb-tab" style="--tc:${t.color}" ${t.current ? 'aria-current="page"' : ''}><i class="tb-ico">${icon(t.icon, 14)}</i><span>${esc(t.label)}</span></span>`).join('');
document.querySelector('[data-zoom="-1"]').innerHTML = icon('minus', 16);
document.querySelector('[data-zoom="0"]').innerHTML = icon('fit', 16);
document.querySelector('[data-zoom="1"]').innerHTML = icon('plus', 16);

function currentTheme() { const t = document.documentElement.dataset.theme; return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function setTheme(t) { document.documentElement.dataset.theme = t; $('#themeBtn').innerHTML = icon(t === 'dark' ? 'sun' : 'moon', 17); try { localStorage.setItem('ua-theme', t); } catch { /* ignore */ } }
try { const t = localStorage.getItem('ua-theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* ignore */ }
$('#themeBtn').innerHTML = icon(currentTheme() === 'dark' ? 'sun' : 'moon', 17);
$('#themeBtn').addEventListener('click', () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
window.addEventListener('resize', () => { updateSelbar(); positionPop(); });
$('#sideBtn').innerHTML = icon('panel', 17);
$('#sideBtn').addEventListener('click', () => {
  const closed = document.body.classList.toggle('side-closed');
  $('#sideBtn').setAttribute('aria-pressed', String(!closed));
  requestAnimationFrame(() => fitView());
});

// ---------- boot ----------
(async function boot() {
  try {
    const p = await api('/api/primitives');
    S.prims = Object.fromEntries((p.primitives || []).map((x) => [x.type, x]));
    S.rules = p.rules || [];
    S.aliasMap = p.aliasMap || {};
  } catch {
    document.getElementById('app').innerHTML = `<div class="fatal"><div><h2>Start the Architect server</h2><p class="muted">From the repo root run <code>node prototypes/architect/app/server.mjs</code>, then open <code>http://127.0.0.1:4455</code>.</p></div></div>`;
    return;
  }
  await loadPlans();
  const want = new URLSearchParams(location.search).get('plan') || S.plans[0]?.id || 'live-channel-demo';
  await openPlan(want);
  renderComposer();
})();
})();
</script>
